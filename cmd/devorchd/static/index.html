<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOrch - AI Coding Agent</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-primary: #58a6ff;
            --accent-success: #3fb950;
            --accent-warning: #d29922;
            --accent-danger: #f85149;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .logo .version {
            background: var(--bg-tertiary);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-success);
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .card h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card h2 .icon {
            font-size: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .stat-item {
            background: var(--bg-tertiary);
            padding: 16px;
            border-radius: 8px;
        }

        .stat-item .label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .stat-item .value {
            font-size: 20px;
            font-weight: 600;
        }

        .provider-list {
            list-style: none;
        }

        .provider-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .provider-item:last-child {
            margin-bottom: 0;
        }

        .provider-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .provider-icon {
            width: 32px;
            height: 32px;
            background: var(--bg-primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .provider-name {
            font-weight: 500;
        }

        .provider-type {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-success {
            background: rgba(63, 185, 80, 0.2);
            color: var(--accent-success);
        }

        .badge-warning {
            background: rgba(210, 153, 34, 0.2);
            color: var(--accent-warning);
        }

        .hw-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .hw-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .hw-item:last-child {
            border-bottom: none;
        }

        .hw-label {
            color: var(--text-secondary);
        }

        .hw-value {
            font-weight: 500;
        }

        .chat-section {
            grid-column: 1 / -1;
        }

        .chat-container {
            background: var(--bg-tertiary);
            border-radius: 8px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            max-height: 400px;
        }

        .chat-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-secondary);
        }

        .chat-empty .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .chat-input-container {
            display: flex;
            gap: 12px;
            padding: 16px;
            border-top: 1px solid var(--border-color);
        }

        .chat-input {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .chat-input:focus {
            border-color: var(--accent-primary);
        }

        .btn {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .model-recommendation {
            background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
            border: 1px solid var(--accent-primary);
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
        }

        .model-recommendation .title {
            font-size: 14px;
            color: var(--accent-primary);
            margin-bottom: 8px;
        }

        .model-recommendation .model-name {
            font-size: 18px;
            font-weight: 600;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message {
            margin-bottom: 16px;
            padding: 12px 16px;
            border-radius: 8px;
        }

        .message-user {
            background: var(--accent-primary);
            margin-left: 40px;
        }

        .message-assistant {
            background: var(--bg-secondary);
            margin-right: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <h1>🚀 DevOrch</h1>
                <span class="version">v1.0</span>
            </div>
            <div class="status-badge">
                <span class="status-dot"></span>
                <span>Server Running</span>
            </div>
        </header>

        <div class="dashboard">
            <!-- System Info Card -->
            <div class="card">
                <h2><span class="icon">🖥️</span> System Info</h2>
                <div class="hw-info" id="system-info">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>

            <!-- Providers Card -->
            <div class="card">
                <h2><span class="icon">🤖</span> Providers</h2>
                <ul class="provider-list" id="providers">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </ul>
            </div>

            <!-- Stats Card -->
            <div class="card">
                <h2><span class="icon">📊</span> Statistics</h2>
                <div class="stats-grid" id="stats">
                    <div class="stat-item">
                        <div class="label">Total Requests</div>
                        <div class="value" id="total-requests">-</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">Active Sessions</div>
                        <div class="value" id="active-sessions">-</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">Avg Latency</div>
                        <div class="value" id="avg-latency">-</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">Uptime</div>
                        <div class="value" id="uptime">-</div>
                    </div>
                </div>
            </div>

            <!-- Chat Section -->
            <div class="card chat-section">
                <h2><span class="icon">💬</span> Chat</h2>
                <div class="chat-container">
                    <div class="chat-messages" id="chat-messages">
                        <div class="chat-empty">
                            <span class="icon">💡</span>
                            <p>Start a conversation to interact with DevOrch</p>
                        </div>
                    </div>
                    <div class="chat-input-container">
                        <input type="text" class="chat-input" id="chat-input" placeholder="Type your message..." />
                        <button class="btn" id="send-btn">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Fetch system info
        async function loadSystemInfo() {
            try {
                const response = await fetch('/api/system/info');
                const data = await response.json();
                
                const container = document.getElementById('system-info');
                container.innerHTML = `
                    <div class="hw-item">
                        <span class="hw-label">OS / Arch</span>
                        <span class="hw-value">${data.os} (${data.arch})</span>
                    </div>
                    <div class="hw-item">
                        <span class="hw-label">CPU Cores</span>
                        <span class="hw-value">${data.cpu_count}</span>
                    </div>
                    <div class="hw-item">
                        <span class="hw-label">Memory</span>
                        <span class="hw-value">${(data.mem_total_mb / 1024).toFixed(1)} GB</span>
                    </div>
                    <div class="hw-item">
                        <span class="hw-label">GPU Acceleration</span>
                        <span class="hw-value">${data.has_accel ? data.accel_kind : 'None'}</span>
                    </div>
                    <div class="hw-item">
                        <span class="hw-label">System Tier</span>
                        <span class="hw-value">${data.tier.charAt(0).toUpperCase() + data.tier.slice(1)}</span>
                    </div>
                    <div class="model-recommendation">
                        <div class="title">💡 Recommended Model Size</div>
                        <div class="model-name">${data.recommended_size}</div>
                    </div>
                `;
            } catch (err) {
                console.error('Failed to load system info:', err);
                document.getElementById('system-info').innerHTML = '<p>Failed to load system info</p>';
            }
        }

        // Fetch providers
        async function loadProviders() {
            try {
                const response = await fetch('/api/providers');
                const providers = await response.json();
                
                const container = document.getElementById('providers');
                if (providers.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-secondary); padding: 16px;">No providers configured</p>';
                    return;
                }
                
                container.innerHTML = providers.map(p => `
                    <li class="provider-item">
                        <div class="provider-info">
                            <div class="provider-icon">${getProviderIcon(p.Name)}</div>
                            <div>
                                <div class="provider-name">${p.Name}</div>
                                <div class="provider-type">${p.Kind}</div>
                            </div>
                        </div>
                        <span class="badge badge-success">Active</span>
                    </li>
                `).join('');
            } catch (err) {
                console.error('Failed to load providers:', err);
                document.getElementById('providers').innerHTML = '<p>Failed to load providers</p>';
            }
        }

        function getProviderIcon(name) {
            const icons = {
                'ollama': '🦙',
                'openai': '🤖',
                'anthropic': '🧠',
                'openrouter': '🌐',
                'google': '🔮'
            };
            return icons[name.toLowerCase()] || '⚡';
        }

        // Fetch stats
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();
                
                document.getElementById('total-requests').textContent = stats.length || '0';
                document.getElementById('active-sessions').textContent = '1';
                document.getElementById('avg-latency').textContent = stats.length > 0 
                    ? Math.round(stats.reduce((a, b) => a + (b.latency_ms || 0), 0) / stats.length) + 'ms'
                    : '-';
                document.getElementById('uptime').textContent = 'Active';
            } catch (err) {
                console.error('Failed to load stats:', err);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadSystemInfo();
            loadProviders();
            loadStats();
            
            // Refresh every 30 seconds
            setInterval(() => {
                loadStats();
            }, 30000);
        });

        // Simple chat functionality
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const chatMessages = document.getElementById('chat-messages');

        function addMessage(content, isUser) {
            // Clear empty state
            const empty = chatMessages.querySelector('.chat-empty');
            if (empty) empty.remove();
            
            const msg = document.createElement('div');
            msg.className = `message ${isUser ? 'message-user' : 'message-assistant'}`;
            msg.textContent = content;
            chatMessages.appendChild(msg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendBtn.addEventListener('click', () => {
            const text = chatInput.value.trim();
            if (!text) return;
            
            addMessage(text, true);
            chatInput.value = '';
            
            // Simulate response (in real implementation, call /api/chat)
            setTimeout(() => {
                addMessage('Chat endpoint coming soon. Use the CLI for full functionality: devorch chat --prompt "' + text + '"', false);
            }, 500);
        });

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendBtn.click();
        });
    </script>
</body>
</html>
