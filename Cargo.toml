[workspace]
resolver = "2"
members = [
    "crates/devorch-protocol",
    "crates/devorch-config",
    "crates/devorch-store",
    "crates/devorch-events",
    "crates/devorch-process",
    "crates/devorch-git",
    "crates/devorch-workspace",
    "crates/devorch-agent",
    "bins/devorch",
    "xtask",
]

[workspace.package]
version = "3.0.0-alpha.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sanghyeonhd/devorch"
rust-version = "1.85"

[workspace.dependencies]
devorch-protocol = { path = "crates/devorch-protocol" }
devorch-config = { path = "crates/devorch-config" }
devorch-store = { path = "crates/devorch-store" }
devorch-events = { path = "crates/devorch-events" }
devorch-process = { path = "crates/devorch-process" }
devorch-git = { path = "crates/devorch-git" }
devorch-workspace = { path = "crates/devorch-workspace" }
devorch-agent = { path = "crates/devorch-agent" }

anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "io-util", "time", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
