name: DevOrch Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  devorch:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, '/devorch')
    steps:
      - uses: actions/checkout@v4
      - name: Parse command
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body;
            const cmd = body.split('\n')[0].trim();
            const match = cmd.match(/^\/devorch\s+(\S+)(?:\s+(.*))?$/);
            return match ? { name: match[1], args: match[2]||'' } : { name: 'help', args: '' };
      - name: Call DevOrch server (example)
        env:
          DEVORCH_SERVER: ${{ secrets.DEVORCH_SERVER }}
        run: |
          echo "Tool: ${{ steps.parse.outputs.result.name }}"
          echo "Args: ${{ steps.parse.outputs.result.args }}"
          if [ -z "$DEVORCH_SERVER" ]; then echo "DEVORCH_SERVER secret not set"; exit 0; fi
          curl -sS -X POST "$DEVORCH_SERVER/api/tools/execute" \
            -H "Content-Type: application/json" \
            -d "{\"name\": \"${{ steps.parse.outputs.result.name }}\", \"params\": {\"input\": \"${{ steps.parse.outputs.result.args }}\"}}" || true
